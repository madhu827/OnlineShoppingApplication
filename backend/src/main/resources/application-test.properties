# =============================================
# Test Profile — disables real DB connections
# =============================================
# Used by OnlineShoppingApplicationTests with @ActiveProfiles("test")

# Disable Cassandra auto-configuration in unit tests
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.cassandra.CassandraAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.cassandra.CassandraDataAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.cassandra.CassandraReactiveDataAutoConfiguration

# Embedded/stub MongoDB for tests
spring.data.mongodb.uri=mongodb://localhost:27017/test_online_shopping

# JWT test secret (Base64-encoded)
app.jwt.secret=dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItdW5pdC10ZXN0aW5nLW9ubHktMTIz

# Reduce log noise during tests
logging.level.com.onlineshopping=WARN
logging.level.org.springframework=WARN

