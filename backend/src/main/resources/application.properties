# =============================================
# Online Shopping Application Configuration
# =============================================

spring.application.name=online-shopping-backend
server.port=8080

# =============================================
# MongoDB Configuration
# =============================================
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=online_shopping

# Auto-index creation for MongoDB
spring.data.mongodb.auto-index-creation=true

# =============================================
# Apache Cassandra Configuration
# =============================================
spring.cassandra.contact-points=${CASSANDRA_HOST:127.0.0.1}
spring.cassandra.port=${CASSANDRA_PORT:9042}
spring.cassandra.keyspace-name=${CASSANDRA_KEYSPACE:online_shopping}
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.schema-action=CREATE_IF_NOT_EXISTS

# Cassandra connection timeout
spring.cassandra.connection.connect-timeout=10s
spring.cassandra.connection.init-query-timeout=10s
spring.cassandra.request.timeout=10s

# Exclude Spring Boot Cassandra auto-configuration — our CassandraConfig
# (which extends AbstractCassandraConfiguration) is the single source of truth.
# Preventing Boot from creating a duplicate CqlSession bean.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.cassandra.CassandraAutoConfiguration

# =============================================
# JWT Configuration
# =============================================
# Default is a 256-bit Base64-encoded HMAC-SHA256 secret key.
# OVERRIDE this in production via the JWT_SECRET environment variable.
app.jwt.secret=${JWT_SECRET:bm9kZUpTLWp3dC1zZWNyZXQta2V5LWZvci1vbmxpbmUtc2hvcHBpbmctYXBw}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# =============================================
# SpringDoc / Swagger UI Configuration
# =============================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# =============================================
# CORS Configuration
# =============================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# =============================================
# Logging Configuration
# =============================================
logging.level.com.onlineshopping=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.springframework.data.cassandra=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
